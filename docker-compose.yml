version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: relief_postgis
    environment:
      POSTGRES_DB: relief_db
      POSTGRES_USER: relief_admin
      POSTGRES_PASSWORD: relief_pass
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: